<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <h1>☕ Coffee Shop</h1>
    <nav>
      <a href="#menu">Menu</a>
      <a href="#cart">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </header>

  <!-- Hero Banner -->
  <section class="hero">
    <h2>Fresh Coffee & Pastries</h2>
    <p>Handcrafted espresso, iced lattes, and fresh baked goods.</p>
  </section>

  <!-- Menu Section -->
  <section id="menu" class="container">
    <h2>Our Menu</h2>
    <div id="menu-grid" class="grid"></div>
  </section>

  <!-- Cart Section -->
  <section id="cart" class="container">
    <h2>Your Cart</h2>
    <div id="cart-items"></div>
    <div class="cart-summary">
      <h3>Total: ৳<span id="cart-total">0</span></h3>
      <button onclick="checkout()" class="btn">Checkout</button>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 Coffee Shop. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
